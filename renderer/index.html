<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
    <title>PkgGUI Prototype</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
      header { display:flex; gap:1rem; align-items:center }
      button { padding: .5rem 1rem }
      .manifests { margin-top: 1rem }
      pre { background:#f6f6f8; padding:1rem; overflow:auto }
    </style>
  </head>
  <body>
    <header>
      <h1>PkgGUI Prototype</h1>
      <div style="margin-left:auto">
        <button id="pick">Pick Project Folder</button>
      </div>
    </header>

    <main>
      <div id="info">No folder selected.</div>
      <div class="manifests" id="manifests"></div>
    </main>

    <script>
      const pickBtn = document.getElementById('pick')
      const info = document.getElementById('info')
      const manifests = document.getElementById('manifests')

      pickBtn.addEventListener('click', async () => {
        const folder = await window.api.pickFolder()
        if (!folder) return
        info.textContent = `Scanning ${folder}...`
        const res = await window.api.scanProject(folder)
        if (!res.ok) { info.textContent = 'Error: ' + res.error; return }
        const data = res.result
        info.textContent = `Found ${data.manifests.length} manifest(s) in ${data.path}`
        manifests.innerHTML = ''
        data.manifests.forEach(m => {
          const el = document.createElement('div')
          el.innerHTML = `<strong>${m.manager}</strong>: ${m.file}`
          if (m.data) el.innerHTML += `<pre>${JSON.stringify(m.data, null, 2)}</pre>`
          manifests.appendChild(el)
        })
      })
    </script>
  </body>
</html>
