[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = ["protocol-asset"] }
tauri-plugin-log = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
toml = "0.7"
serde_yaml = "0.9"
regex = "1.9"
base64 = "0.22"
walkdir = "2.3"
dirs = "5.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Optimize dependencies in dev mode for faster execution
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
incremental = true
split-debuginfo = "unpacked" # Faster linking on Windows

[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
